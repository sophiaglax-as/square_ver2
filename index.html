<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1f44">
<title>スクエア集計</title>
<style>
:root{--navy:#0b1f44;--yellow:#ffd54a;--bg:#f3f6fb;--line:#d7deea;--text:#14213d;--muted:#667085;--danger:#c62828;--ok:#167c3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
body{min-height:100vh;background:linear-gradient(180deg,var(--navy) 0 150px,var(--bg) 150px 100%);padding-bottom:24px}
button,input,select{font:inherit}button{cursor:pointer}
.app{width:100%;max-width:820px;margin:0 auto;padding:12px}
.hero{color:#fff;padding:8px 4px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h1{margin:0;font-size:24px;font-weight:900}.hero p{margin:5px 0 0;font-size:12px;opacity:.9}
.gear{width:46px;height:46px;border:0;border-radius:15px;background:rgba(255,255,255,.14);color:#fff;font-size:22px}
.msg{display:none;margin-bottom:10px;padding:12px 14px;border-radius:16px;font-size:13px;font-weight:800;line-height:1.5}
.msg.show{display:block}.msg.ok{background:#e9f8ef;color:var(--ok)}.msg.err{background:#fdecec;color:var(--danger)}
.shell{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 10px 24px rgba(11,31,68,.08)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--navy);padding:9px}
.tab{border:0;min-height:52px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:900}
.tab.active{background:var(--yellow);color:var(--navy)}
.panel{display:none;padding:14px}.panel.active{display:block}
.section{border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:11px;background:#fff}
.title{margin:0 0 10px;color:var(--navy);font-size:17px;font-weight:900}
.desc{margin:-3px 0 11px;color:var(--muted);font-size:12px;line-height:1.55}
.current{padding:15px;border-radius:18px;background:var(--navy);color:#fff;margin-bottom:12px}
.current small{display:block;opacity:.8;font-weight:800;margin-bottom:5px}.current strong{font-size:18px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.playerBtn,.catBtn,.teamBtn{min-height:68px;border:2px solid var(--line);border-radius:17px;background:#fff;color:var(--navy);font-weight:900;padding:9px}
.playerBtn.selected,.catBtn.selected,.teamBtn.selected{border-color:var(--navy);background:var(--yellow);box-shadow:0 4px 10px rgba(255,213,74,.3)}
.sub{display:block;font-size:11px;opacity:.7;margin-top:4px}
.input,.select{width:100%;max-width: 100%;min-width: 0;min-height:50px;border:1.5px solid var(--line);border-radius:15px;padding:12px;background:#fff;color:var(--text);font-size:16px;box-sizing:border-box;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.field label{font-size:12px;font-weight:900;color:var(--navy)}
.btn{width:100%;min-height:50px;border:0;border-radius:15px;font-weight:900}
.primary{background:var(--yellow);color:var(--navy)}.secondary{background:var(--navy);color:#fff}.ghost{background:#eef4ff;color:var(--navy)}.danger{background:#fdecec;color:var(--danger)}
.summary{background:#f8faff;border:1px dashed var(--line);border-radius:16px;padding:11px}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf1f7;font-size:13px}.row:last-child{border:0}
.key{color:var(--muted);font-weight:800}.val{text-align:right;color:var(--navy);font-weight:900}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:#fff}
.table{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}.table th,.table td{padding:9px;border-bottom:1px solid #edf1f7;text-align:center}.table th{background:#f7f9fc;color:var(--navy)}.table .left{text-align:left}
.reportCard{background:#fff;padding:20px;border-radius:18px}.reportTitle{font-size:20px;font-weight:900;color:var(--navy)}.reportDate{font-size:12px;color:var(--muted);margin:4px 0 14px}
.topList{display:grid;gap:8px}.topItem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:900}.topTeam{text-align:center;color:var(--muted)}.topValue{font-size:18px}
.rawList{display:grid;gap:8px}.rawItem{border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;font-size:12px}.rawItem input{width:18px;height:18px}
.settingCard{border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:9px}.badge{font-size:10px;font-weight:900;padding:6px 9px;border-radius:999px}.badge.active{background:#e9f8ef;color:var(--ok)}.badge.hidden{background:#f2f4f7;color:var(--muted)}
.smallBtn{border:0;border-radius:12px;padding:9px 11px;font-weight:900}.empty{text-align:center;padding:18px;color:var(--muted);font-size:13px}
.hiddenEl{display:none!important}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div><h1>スクエア集計</h1></div>
  <button id="btnSettings" class="gear">⚙️</button>
</header>
<div id="msg" class="msg"></div>

<main class="shell">
<nav class="tabs">
  <button class="tab active" data-tab="assignment">👥 今日の担当</button>
  <button class="tab" data-tab="input">✏️ 入力</button>
  <button class="tab" data-tab="report">📊 結果</button>
</nav>

<section id="panelAssignment" class="panel active">
  <div class="current">
    <small>今日の担当</small>
    <strong id="assignedSummary">未登録</strong>
  </div>

  <div class="section">
    <h2 class="title">今日の担当を選択</h2>
    <div id="assignmentGrid" class="grid"></div>
    <button id="btnSaveAssignments" class="btn primary" style="margin-top:12px">今日の担当を保存</button>
  </div>
</section>

<section id="panelInput" class="panel">
  <div class="current">
    <small>今日の担当</small>
    <strong id="inputAssignedSummary">未登録</strong>
  </div>

  <div class="section">
    <h2 class="title">入力</h2>
    <div class="field">
      <label>日付</label>
      <input id="inputDate" class="input" type="date">
    </div>

    <h3 class="title" style="font-size:15px">選手</h3>
    <div id="mistakeGrid" class="grid"></div>

    <h3 class="title" style="font-size:15px;margin-top:14px">カテゴリー</h3>
    <div id="categoryGrid" class="grid"></div>

    <div class="summary" style="margin-top:12px">
      <div class="row"><span class="key">選手</span><span id="summaryPlayer" class="val">-</span></div>
      <div class="row"><span class="key">カテゴリー</span><span id="summaryCategory" class="val">-</span></div>
    </div>

    <button id="btnSendMistake" class="btn primary" style="margin-top:10px">登録する</button>
  </div>

  <div class="section">
    <h2 class="title">🔥 連続成功回数</h2>

    <h3 class="title" style="font-size:15px">担当チーム</h3>
    <div id="teamGrid" class="grid">
      <button class="teamBtn" data-team="トップ①">トップ①</button>
      <button class="teamBtn" data-team="トップ②">トップ②</button>
      <button class="teamBtn" data-team="サブ①">サブ①</button>
      <button class="teamBtn" data-team="サブ②">サブ②</button>
    </div>

    <div class="field" style="margin-top:14px">
      <label>連続成功回数</label>
      <input id="successCountInput" class="input" type="number" inputmode="numeric" min="1" step="1" placeholder="例：12">
    </div>

    <div class="summary">
      <div class="row"><span class="key">担当チーム</span><span id="summaryTeam" class="val">-</span></div>
      <div class="row"><span class="key">連続成功回数</span><span id="summarySuccessCount" class="val">-</span></div>
    </div>

    <button id="btnSaveSuccess" class="btn secondary" style="margin-top:10px">この記録を保存する</button>
  </div>
</section>

<section id="panelReport" class="panel">
  <div class="section">
    <h2 class="title">📊 結果</h2>
    <div class="field"><label>表示する日付</label><input id="reportDate" class="input" type="date"></div>
    <button id="btnRefreshReport" class="btn secondary">集計を更新</button>
    <button id="btnSaveImage" class="btn primary" style="margin-top:9px">📸 一覧表を画像保存</button>
  </div>

  <div id="reportCanvas" class="reportCard">
    <div class="reportTitle">スクエア集計</div>
    <div id="reportImageDate" class="reportDate"></div>

    <h3 class="title">集計</h3>
    <div class="tableWrap"><table id="mistakeSummaryTable" class="table"></table></div>

    <h3 class="title" style="margin-top:14px">🔥 連続成功回数</h3>
    <div class="tableWrap"><table id="successSummaryTable" class="table"></table></div>
  </div>

  <div class="section" style="margin-top:12px">
    <h2 class="title">🗑️ 誤入力データの削除</h2>

    <h3 class="title" style="font-size:15px">データ一覧</h3>
    <div id="rawMistakeList" class="rawList"></div>
    <button id="btnDeleteMistakes" class="btn danger" style="margin-top:9px">選択したミス入力を削除</button>

    <h3 class="title" style="font-size:15px;margin-top:16px">チーム連続成功数</h3>
    <div id="rawSuccessList" class="rawList"></div>
    <button id="btnDeleteSuccesses" class="btn danger" style="margin-top:9px">選択した連続成功記録を削除</button>
  </div>
</section>
</main>
</div>

<div id="settingsModal" class="hiddenEl" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;padding:20px;overflow:auto">
  <div style="max-width:560px;margin:30px auto;background:#fff;border-radius:24px;padding:16px">
    <button id="btnCloseSettings" class="btn secondary">閉じる</button>
    <h2 class="title" style="margin-top:14px">⚙️ 選手管理</h2>

    <div class="section">
      <input id="newPlayerName" class="input" placeholder="選手名">
      <select id="newPlayerPosition" class="select" style="margin-top:8px">
        <option value="">ポジション</option>
        <option>AT</option><option>MF</option><option>DF</option><option>G</option>
      </select>
      <button id="btnAddPlayer" class="btn primary" style="margin-top:8px">選手を登録</button>
    </div>

    <div id="settingsPlayers"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
